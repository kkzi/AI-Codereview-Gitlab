services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-codereview-gitlab:2.0.0
    container_name: ai-codereview-app
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
    env_file:
      - ./conf/.env
    restart: unless-stopped
