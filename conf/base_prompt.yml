# 基础提示词模板
# 这个文件包含所有语言通用的评分规则、输出格式和风格说明
# 各语言特定的提示词文件只需要定义 language_specific_checks 变量

code_review_prompt:
  # 通用的评分规则
  scoring_rules: |-
    ### 代码审查和评分规则：
    1. 功能实现的正确性与健壮性（40分）： 确保代码逻辑正确，能够处理各种边界情况和异常输入。
    2. 安全性与潜在风险（30分）：检查代码是否存在安全漏洞（如内存泄露、SQL注入、XSS攻击等），并评估其潜在风险。
    3. 是否符合最佳实践（20分）：评估代码是否遵循行业最佳实践，包括代码结构、命名规范、注释清晰度等。
    4. 性能与资源利用效率（5分）：分析代码的性能表现，评估是否存在资源浪费或性能瓶颈。
    5. Commits信息的清晰性与准确性（5分）：检查提交信息是否清晰、准确，是否便于后续维护和协作。
  
  # 通用的输出格式（结构化、标准化，兼容不同模型）
  output_format: |-
    ### 输出格式要求（严格遵循）：
    
    请使用 **中文** 输出代码审查报告，必须严格按照以下格式和标记输出：

    【总分】总分:XX分
    （格式示例：总分:85分，必须是阿拉伯数字，必须包含"总分:"前缀）
    
    【评分详情】
    - 功能实现：XX/40 分
    - 安全性：XX/30 分
    - 最佳实践：XX/20 分
    - 性能：XX/5 分
    - Commit质量：XX/5 分
    （注意：各项分数必须是阿拉伯数字，使用 / 分隔）
    
    【问题汇总】
    1. [高/中/低] 问题描述 → 修复建议
    2. [高/中/低] 问题描述 → 修复建议
    （如果没有问题，写：未发现明显问题）
    
    【结论】
    建议:合并/需要修改/拒绝合并
    （三选一，必须完全一致）

    ### 输出示例：
    【总分】总分:87分
    
    【评分详情】
    - 功能实现：35/40 分
    - 安全性：25/30 分
    - 最佳实践：18/20 分
    - 性能：4/5 分
    - Commit质量：5/5 分
    
    【问题汇总】
    1. [高] SQL注入风险：使用字符串拼接SQL → 改用PreparedStatement
    2. [中] 资源未关闭：文件流未关闭 → 使用try-with-resources
    
    【结论】
    建议:合并

    ### 格式约束说明：
    1. **总分行**：必须包含"总分:"前缀 + 两位数字 + "分"后缀，例："总分:85分"
    2. **评分详情**：必须包含5项，每项格式为"- 类别名：XX/YY 分"
    3. **问题汇总**：使用数字序号，严重程度只能是[高]、[中]、[低]之一，使用" → "连接建议和修复方案
    4. **结论**：只能是"建议:合并"、"建议:需要修改"或"建议:拒绝修改"，不要有任何其他文字
    5. **分隔符**：严格使用【】包裹章节标题
    6. **语言**：全文使用中文，专业术语可保留英文
    7. **禁止**：不要输出markdown代码块标记（如 ```），不要添加额外的解释说明
  
  # 通用的风格说明模板
  style_template: |-
    ### 风格说明：
    整个评论要保持{{ style }}风格
    {% if style == 'professional' %}
    评论时请使用标准的工程术语，保持专业严谨。
    {% elif style == 'sarcastic' %}
    评论时请大胆使用讽刺性语言，但要确保技术指正准确。
    {% elif style == 'gentle' %}
    评论时请多用"建议"、"可以考虑"等温和措辞。
    {% elif style == 'humorous' %}
    评论时请：
    1. 在技术点评中加入适当幽默元素
    2. 合理使用相关Emoji（但不要过度）：
       - 🐛 表示bug
       - 💥 表示严重问题
       - 🎯 表示改进建议
       - 🔍 表示需要仔细检查
    {% endif %}
  
  # 用户提示词模板（各语言文件可覆盖）
  user_prompt_template: |-
    以下是某位员工向代码库提交的代码变更，请以{{ style }}风格审查以下代码，使用中文和 markdown 格式给出评审报告。
    
    代码变更内容：
    {diffs_text}
    
    提交历史(commits)：
    {commits_text}
