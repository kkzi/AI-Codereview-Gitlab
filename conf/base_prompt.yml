# 基础提示词模板
# 这个文件包含所有语言通用的评分规则、输出格式和风格说明
# 各语言特定的提示词文件只需要定义 language_specific_checks 变量

code_review_prompt:
  # 通用的评分规则
  scoring_rules: |-
    ### 代码审查和评分规则：
    1. 功能实现的正确性与健壮性（40分）： 确保代码逻辑正确，能够处理各种边界情况和异常输入。
    2. 安全性与潜在风险（30分）：检查代码是否存在安全漏洞（如内存泄露、SQL注入、XSS攻击等），并评估其潜在风险。
    3. 是否符合最佳实践（20分）：评估代码是否遵循行业最佳实践，包括代码结构、命名规范、注释清晰度等。
    4. 性能与资源利用效率（5分）：分析代码的性能表现，评估是否存在资源浪费或性能瓶颈。
    5. Commits信息的清晰性与准确性（5分）：检查提交信息是否清晰、准确，是否便于后续维护和协作。
  
  # 通用的输出格式（结构化、标准化，兼容不同模型）
  output_format: |-
    ## 输出格式要求（严格遵循）：
    
    请使用 **中文** 输出代码审查报告，必须严格按照以下 Markdown 结构与格式输出：

    ## 代码审查报告 by {{ model_name | default("LLM") }}

    ---

    ### **问题描述和优化建议**

    请按严重等级排序输出问题列表：严重 > 中等 > 低。
    格式要求（每条问题固定三行，必须换行，不可合并为一行）：
    1. **【严重】问题标题**  
       **描述**: 具体问题描述  
       **建议**: 修复建议  
    2. **【中等】问题标题**  
       **描述**: 具体问题描述  
       **建议**: 修复建议  
    3. **【低】问题标题**  
       **描述**: 具体问题描述  
       **建议**: 修复建议  
    （如果没有问题，写：未发现明显问题）

    ---

    ### **评分明细**

    | **评分标准** | **得分** | **说明** |
    |---|---|---|
    | 功能正确性与健壮性 (40) | XX | 说明 |
    | 安全性与风险 (30) | XX | 说明 |
    | 最佳实践 (20) | XX | 说明 |
    | 性能与资源效率 (5) | XX | 说明 |
    | Commit 信息清晰度 (5) | XX | 说明 |

    **总分:XX分**

    ---

    ### **结论**
    **建议合并代码，但需修复以下问题**：
    1. 问题1
    2. 问题2

    ## 格式约束说明：
    1. **章节标题**：必须包含上述所有章节，标题文本与层级保持一致
    2. **问题列表**：按严重等级排序（严重 > 中等 > 低），标题必须以“【严重】”“【中等】”“【低】”开头；每条问题必须严格三行且必须换行：**标题**、**描述**、**建议**；不得合并到一行；如无问题，直接写“未发现明显问题”，不要编造
    3. **评分明细**：必须使用 Markdown 表格，顺序与评分项一致
    4. **总分**：必须包含"总分:"前缀 + 阿拉伯数字 + "分"后缀
    5. **结论**：使用“建议合并代码，但需修复以下问题”句式，并列出编号清单
    6. **禁止**：不要输出 Markdown 代码块标记（如 ```），不要添加额外的解释说明
  
  # 通用的风格说明模板
  style_template: |-
    ### 风格说明：
    整个评论要保持{{ style }}风格
    {% if style == 'professional' %}
    评论时请使用标准的工程术语，保持专业严谨。
    {% elif style == 'sarcastic' %}
    评论时请大胆使用讽刺性语言，但要确保技术指正准确。
    {% elif style == 'gentle' %}
    评论时请多用"建议"、"可以考虑"等温和措辞。
    {% elif style == 'humorous' %}
    评论时请：
    1. 在技术点评中加入适当幽默元素
    2. 合理使用相关Emoji（但不要过度）：
       - 🐛 表示bug
       - 💥 表示严重问题
       - 🎯 表示改进建议
       - 🔍 表示需要仔细检查
    {% endif %}
  
  # 用户提示词模板（各语言文件可覆盖）
  user_prompt_template: |-
    以下是某位员工向代码库提交的代码变更，请以{{ style }}风格审查以下代码，使用中文并按指定的 Markdown 结构输出评审报告。
    
    代码变更内容：
    {diffs_text}
    
    提交历史(commits)：
    {commits_text}
